  <script>
    ;(() => {
      const bootStartedAt = performance.now()
      const params = new URLSearchParams(location.search)
      const debugBoot = params.get('debugBoot') === '1'
      const flags = {
        debugBoot,
        noServiceWorker: params.get('nosw') === '1',
        noNotifications: params.get('nonoti') === '1',
        noAppLock: params.get('noapplock') === '1',
        noFinanceRebuild: params.get('noFinanceRebuild') === '1',
      }
      const log = []
      window.MT_DEBUG_FLAGS = flags
      window.__mtBootLog = log
      window.MTBootCssReady = false
      window.MTBoot = {
        mark(name, extra = {}) {
          const entry = { name, at: Math.round((performance.now() - bootStartedAt) * 10) / 10, ...extra }
          log.push(entry)
          if (debugBoot) console.log('[MT boot]', entry)
          try { localStorage.setItem('mt_boot_last_log', JSON.stringify(log.slice(-80))) } catch (_) {}
          return entry
        },
      }
      window.addEventListener('error', event => {
        window.MTBoot?.mark?.('window.error', { message: event.message, source: event.filename, line: event.lineno })
      })
      window.addEventListener('unhandledrejection', event => {
        window.MTBoot?.mark?.('window.unhandledrejection', { message: event.reason?.message || String(event.reason || '') })
      })
      window.MTBoot.mark('html.inline.start', { flags })
      try {
        if (params.get('demo') === '1') {
          location.replace('./demo/index.html')
        }
      } catch (_) {}
    })()
  </script>
